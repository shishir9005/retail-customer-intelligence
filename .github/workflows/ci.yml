name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install (app + test dependencies; torch and fastembed are only needed for offline training)
        run: pip install -r requirements-dev.txt
      - name: Unit tests, leakage test, SQL-guard attacks, page smoke tests
        env:
          PYTHONPATH: src:.
        run: pytest -q
